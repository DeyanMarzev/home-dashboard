# Local development services for `pnpm dev` (not used on the Pi):
#   docker compose -f docker-compose.dev.yml up -d
# Postgres on 127.0.0.1:5433, Mosquitto on 127.0.0.1:1883. Same images and config as production.
# Reads POSTGRES_* and MQTT_* from .env; see the "Local development" section of .env.example.

name: home-dashboard-dev

services:
  postgres:
    image: timescale/timescaledb:2.31.0-pg17
    command: ['postgres', '-c', 'config_file=/etc/postgresql/postgresql.conf']
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      NO_TS_TUNE: 'true'
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    shm_size: 128m
    ports:
      - '127.0.0.1:5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    entrypoint: ['sh', '/mosquitto/config/entrypoint.sh']
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:?set MQTT_USERNAME in .env}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD in .env}
      MQTT_SENSOR_USERNAME: ${MQTT_SENSOR_USERNAME:?set MQTT_SENSOR_USERNAME in .env}
      MQTT_SENSOR_PASSWORD: ${MQTT_SENSOR_PASSWORD:?set MQTT_SENSOR_PASSWORD in .env}
    volumes:
      - ./docker/mosquitto:/mosquitto/config:ro
      - mqttdata:/mosquitto/data
    ports:
      - '127.0.0.1:1883:1883'

volumes:
  pgdata:
  mqttdata:
