# Home dashboard on the Raspberry Pi 4. See docs/01-architecture.md and docs/06-pi-setup-and-deploy.md.
# Every image here has a linux/arm64 variant (checked 2026-11-07).
# Memory limits are hard limits (CLAUDE.md rule 8); total ~1.8 GB.

name: home-dashboard

x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: '3'

# Hardening (M10). Every container: no privilege gain via setuid binaries. Our own Node
# containers also drop every capability and run with a read-only root filesystem.
x-no-new-privileges: &no-new-privileges ['no-new-privileges:true']

services:
  postgres:
    image: timescale/timescaledb:2.31.0-pg17
    restart: unless-stopped
    command: ['postgres', '-c', 'config_file=/etc/postgresql/postgresql.conf']
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      NO_TS_TUNE: 'true' # keep the values in postgresql.conf
      TZ: UTC
    volumes:
      - ${DATA_DIR:?set DATA_DIR in .env}/postgres:/var/lib/postgresql/data
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    shm_size: 128m
    # Not published to the host. If ever needed: "127.0.0.1:5433:5432" (5432 may be in use).
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
    security_opt: *no-new-privileges
    networks: [home]
    logging: *logging

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    restart: unless-stopped
    entrypoint: ['sh', '/mosquitto/config/entrypoint.sh']
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:?set MQTT_USERNAME in .env}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD in .env}
      MQTT_SENSOR_USERNAME: ${MQTT_SENSOR_USERNAME:?set MQTT_SENSOR_USERNAME in .env}
      MQTT_SENSOR_PASSWORD: ${MQTT_SENSOR_PASSWORD:?set MQTT_SENSOR_PASSWORD in .env}
      MQTT_NETPROBE_USERNAME: ${MQTT_NETPROBE_USERNAME:-}
      MQTT_NETPROBE_PASSWORD: ${MQTT_NETPROBE_PASSWORD:-}
    volumes:
      - ./docker/mosquitto:/mosquitto/config:ro
      - ${DATA_DIR}/mosquitto/data:/mosquitto/data
    ports:
      - '1883:1883' # ESP32 sensors on the home Wi-Fi connect here
    healthcheck:
      test:
        - CMD-SHELL
        - mosquitto_sub -h 127.0.0.1 -u "$$MQTT_USERNAME" -P "$$MQTT_PASSWORD" -t '$$SYS/broker/uptime' -C 1 -W 5
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64m
    security_opt: *no-new-privileges
    networks: [home]
    logging: *logging

  collector:
    build:
      context: .
      target: collector
    image: home-dashboard/collector
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=160
      TZ: Europe/London
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PGHOST: postgres
      PGPORT: '5432'
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      HOST_SYS: /host/sys
      HOST_PROC: /host/proc
      HOST_ROOTFS: /host/rootfs
      HOST_DATA_DIR: /host/data
      HOME_LAT: ${HOME_LAT:-}
      HOME_LON: ${HOME_LON:-}
      HOME_POSTCODE_OUTCODE: ${HOME_POSTCODE_OUTCODE:-}
      NEST_PROJECT_ID: ${NEST_PROJECT_ID:-}
      NEST_CLIENT_ID: ${NEST_CLIENT_ID:-}
      NEST_CLIENT_SECRET: ${NEST_CLIENT_SECRET:-}
      NEST_REFRESH_TOKEN: ${NEST_REFRESH_TOKEN:-}
      METER_PROVIDER: ${METER_PROVIDER:-fake}
      WATER_PROVIDER: ${WATER_PROVIDER:-fake}
      THAMES_EMAIL: ${THAMES_EMAIL:-}
      THAMES_PASSWORD: ${THAMES_PASSWORD:-}
      THAMES_ACCOUNT_NUMBER: ${THAMES_ACCOUNT_NUMBER:-}
      THAMES_METER_ID: ${THAMES_METER_ID:-}
      BOILER_FLOW_W1_ID: ${BOILER_FLOW_W1_ID:-}
      BOILER_RETURN_W1_ID: ${BOILER_RETURN_W1_ID:-}
    volumes:
      - ./config:/app/config:ro # source registry; edit + `docker compose restart api collector`
      # Pi health (pi_stats) and 1-Wire boiler probes (/host/sys/bus/w1/devices). Read-only.
      - /sys:/host/sys:ro
      - /proc:/host/proc:ro
      - /:/host/rootfs:ro # statfs of the SD card root filesystem
      - ${DATA_DIR}:/host/data:ro # statfs of the SSD
    depends_on:
      postgres: { condition: service_healthy }
      mosquitto: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 256m
    security_opt: *no-new-privileges
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    networks: [home]
    logging: *logging

  api:
    build:
      context: .
      target: api
    image: home-dashboard/api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=256
      TZ: Europe/London
      PORT: '3000'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PGHOST: postgres
      PGPORT: '5432'
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      CF_ACCESS_TEAM: ${CF_ACCESS_TEAM:?set CF_ACCESS_TEAM in .env (docs/06 §5.1)}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:?set CF_ACCESS_AUD in .env (docs/06 §5.2)}
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
    volumes:
      - ./config:/app/config:ro
    ports:
      - '127.0.0.1:3000:3000' # local debugging on the Pi only; never port 8000 (FastAPI project)
    depends_on:
      postgres: { condition: service_healthy }
    # Healthcheck is defined in the Dockerfile (GET /api/health).
    deploy:
      resources:
        limits:
          memory: 384m
    security_opt: *no-new-privileges
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    networks: [home]
    logging: *logging

  # Network measurements from the host network: the Pi's Wi-Fi, latency, devices, channel
  # scans, daily speed test. Publishes to MQTT on localhost:1883 (docs/01, docs/03 § wifi).
  netprobe:
    build:
      context: .
      target: netprobe
    image: home-dashboard/netprobe
    restart: unless-stopped
    network_mode: host
    # Root inside the container, but with only these two capabilities: NET_ADMIN for Wi-Fi
    # scans (iw), NET_RAW for ping and arp-scan.
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW]
    security_opt: *no-new-privileges
    read_only: true
    tmpfs: [/tmp]
    environment:
      MQTT_URL: mqtt://127.0.0.1:1883
      MQTT_NETPROBE_USERNAME: ${MQTT_NETPROBE_USERNAME:?set MQTT_NETPROBE_USERNAME in .env}
      MQTT_NETPROBE_PASSWORD: ${MQTT_NETPROBE_PASSWORD:?set MQTT_NETPROBE_PASSWORD in .env}
      WIFI_INTERFACE: ${WIFI_INTERFACE:-wlan0}
      PING_TARGET: ${PING_TARGET:-1.1.1.1}
      ROUTER_URL: ${ROUTER_URL:-}
      ROUTER_PASSWORD: ${ROUTER_PASSWORD:-}
      TZ: Europe/London
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mosquitto: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 96m
    logging: *logging

  # Publishes realistic readings for three rooms, as real sensors would (M3 pipeline test).
  # Off by default:  docker compose --profile fake up -d fake-sensor  ·  docker compose stop fake-sensor
  fake-sensor:
    profiles: [fake]
    build:
      context: .
      target: collector
    image: home-dashboard/collector
    restart: unless-stopped
    command: ['node', 'dist/tools/fake-sensor.js']
    security_opt: *no-new-privileges
    cap_drop: [ALL]
    read_only: true
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_SENSOR_USERNAME: ${MQTT_SENSOR_USERNAME}
      MQTT_SENSOR_PASSWORD: ${MQTT_SENSOR_PASSWORD}
      TZ: Europe/London
    depends_on:
      mosquitto: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 64m
    networks: [home]
    logging: *logging

  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    command: ['tunnel', '--no-autoupdate', 'run']
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      api: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 128m
    security_opt: *no-new-privileges
    networks: [home]
    logging: *logging

networks:
  home:
    name: home
