# The source registry: the source of truth for every data source (docs/03-sources-and-freshness.md).
# Validated at startup by api and collector (packages/shared/src/registry.ts) and mirrored into
# the `sources` table. Source ids are stable forever. Removing a source here disables it
# (its history stays in the database).
#
# Fields: name, description (shown in the data sources table), kind (sensor | api | scrape | local | derived), poll (duration or "cron: <expr>",
# Europe/London) for pull sources, push_interval for push sources (kind: sensor),
# expected_delay (default 0s), grace (default 12h for delayed sources), enabled (default true),
# mqtt_topic, options (non-secret settings for the collector; secrets go in .env).
# Durations: 30s, 15m, 6h, 1d.

sources:
  room_sensors:
    name: Room sensors
    description: Temp, humidity, CO₂, pressure
    kind: sensor # pushed over MQTT
    expected_delay: 0s
    push_interval: 30s # how often sensors normally report (sets the Live window)
    mqtt_topic: home/sensors/+/+ # home/sensors/<entity>/<metric>

  pi_stats:
    name: Raspberry Pi
    description: CPU temperature, throttling, memory, disk
    kind: local
    poll: 1m
    expected_delay: 0s

  open_meteo:
    name: Open-Meteo weather
    description: Outdoor weather, forecast
    kind: api
    poll: 15m
    expected_delay: 0s

  carbon_intensity:
    name: Grid carbon intensity
    description: Grid gCO₂/kWh, 48 h forecast
    kind: api
    poll: 30m
    expected_delay: 0s

  # Measured by the netprobe container (host network) and pushed over MQTT (docs/01, docs/03).
  wifi:
    name: Wi-Fi and network
    description: Pi's Wi-Fi link, latency, devices, channels
    kind: local
    push_interval: 5m
    expected_delay: 0s
    mqtt_topic: home/net/wifi

  speed_test:
    name: Broadband speed test
    description: Download, upload, latency (daily 12:00)
    kind: local
    push_interval: 1d
    expected_delay: 0s
    mqtt_topic: home/net/speed_test

  # Not built yet: enabled in the milestone that adds the collector (docs/07-build-plan.md).
  # Disabled sources don't show as Late or raise events.

  boiler_probes: # built (M6); enable once the probes are fitted and their ids are in .env (docs/06 §5c)
    name: Boiler pipe probes
    description: Flow and return temperature
    kind: local
    poll: 30s
    expected_delay: 0s
    enabled: false

  nest: # built (M6); enable once the NEST_* values are in .env (docs/06 §5b)
    name: Nest thermostat
    description: Temp, humidity, target, boiler status
    kind: api
    poll: 2m
    expected_delay: 0s
    enabled: false

  smart_meters: # Bright (Hildebrand Glowmarkt) API; needs BRIGHT_USERNAME/PASSWORD in .env (docs/06 § 5e)
    name: Smart meters
    description: Electricity and gas, half-hourly (Bright)
    kind: api
    poll: 6h
    expected_delay: 1d # readings arrive the next day
    grace: 12h

  thames_water: # built (M8) with only a `fake` provider (sample data); enable once the real one exists (docs/08 question 13)
    name: Thames Water
    description: Water, hourly
    kind: scrape
    poll: 'cron: 0 6 * * *' # daily 06:00 Europe/London
    expected_delay: 3d
    grace: 1d
    enabled: false
