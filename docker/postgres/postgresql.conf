# PostgreSQL 17 + TimescaleDB on a Raspberry Pi 4 (4 GB). See docs/01-architecture.md.
# Mounted read-only and loaded with `-c config_file=...`, so this is the whole config.

listen_addresses = '*'
port = 5432
shared_preload_libraries = 'timescaledb'

# Memory (container limit is 1 GB)
max_connections = 30
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 8MB
maintenance_work_mem = 64MB

# Workers
max_worker_processes = 8
max_parallel_workers = 2
max_parallel_workers_per_gather = 1
timescaledb.max_background_workers = 4

# WAL / storage (data lives on a USB SSD)
wal_compression = on
max_wal_size = 1GB
min_wal_size = 80MB
random_page_cost = 1.1
effective_io_concurrency = 100

# Always UTC in the database; the API converts to Europe/London for display.
timezone = 'UTC'
log_timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'C'
default_text_search_config = 'pg_catalog.english'
dynamic_shared_memory_type = posix

timescaledb.telemetry_level = off
