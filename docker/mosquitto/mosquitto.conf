# Mosquitto 2.1 broker for the room sensors. Password auth, no anonymous access.
# The password and ACL files are generated at container start from .env by
# docker/mosquitto/entrypoint.sh (they never live in the repo).

listener 1883
allow_anonymous false

# Deprecated in 2.1 in favour of plugins, still supported until 3.0.
password_file /mosquitto/auth/passwd
acl_file /mosquitto/auth/acl

persistence true
persistence_location /mosquitto/data/

# Logs go to `docker compose logs mosquitto`.
log_dest stdout
log_type error
log_type warning
log_type notice
